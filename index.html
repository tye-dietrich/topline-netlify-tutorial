<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Topline Guide"/>
<meta name="theme-color" content="#0a0a0c"/>
<title>Topline — Deployment Guide</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a0a0c;color:#ddd;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}

  /* ── APP SHELL ── */
  #app{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available}

  /* ── TOP HEADER ── */
  #header{background:#0c0c12;border-bottom:2px solid #F5C300;padding:env(safe-area-inset-top,12px) 16px 12px;flex-shrink:0}
  #header-inner{display:flex;align-items:center;justify-content:space-between}
  .logo-row{display:flex;align-items:center;gap:8px}
  .tps{background:#F5C300;border-radius:5px;padding:4px 8px;font-family:'Impact','Arial Black',sans-serif;font-size:15px;font-weight:900;color:#000;letter-spacing:1px}
  .logo-text .l1{font-family:'Impact','Arial Black',sans-serif;font-size:13px;font-weight:900;color:#fff;letter-spacing:2px;line-height:1}
  .logo-text .l2{font-size:8px;color:#2B4FD4;letter-spacing:2px;font-weight:700}

  /* progress pill */
  #prog-pill{background:#1a1a28;border-radius:20px;padding:4px 12px;display:flex;align-items:center;gap:8px}
  #prog-pill span{font-size:10px;color:#F5C300;font-weight:800}
  #prog-track{width:60px;height:4px;background:#2a2a3a;border-radius:2px}
  #prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#F5C300,#2B4FD4);transition:width .4s ease}

  /* ── STEP HERO ── */
  #hero{padding:14px 16px 10px;flex-shrink:0;transition:background .3s}
  #hero-step{font-size:10px;font-weight:800;letter-spacing:2px;display:flex;align-items:center;gap:6px;margin-bottom:4px}
  #hero-title{font-size:19px;color:#fff;font-weight:900;line-height:1.25}
  #hero-sub{font-size:12px;color:#666;margin-top:3px;line-height:1.4}

  /* ── SCROLL CONTENT ── */
  #scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 120px}

  /* sections */
  .section{margin-bottom:22px}
  .sec-head{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding-top:18px}
  .sec-head span{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
  .sec-body{color:#bbb;line-height:1.8;font-size:13px;margin:0 0 12px 14px}

  .step-row{display:flex;gap:11px;margin-bottom:10px;align-items:flex-start}
  .step-num{min-width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;margin-top:1px}
  .step-text{color:#ccc;line-height:1.75;font-size:13px;padding-top:2px}

  .callout{display:flex;gap:12px;border-radius:10px;padding:14px 16px;margin-bottom:22px;border-left-width:4px;border-left-style:solid}
  .callout-icon{font-size:18px;flex-shrink:0;line-height:1.3}
  .callout-text{color:#c8d8ff;font-size:13px;line-height:1.75}

  .diamond-row{display:flex;gap:7px;align-items:center;margin:24px 0 20px;opacity:.3;flex-wrap:wrap}
  .d{width:7px;height:7px;transform:rotate(45deg);flex-shrink:0}

  /* ── BOTTOM NAV ── */
  #bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0c0c12;border-top:1px solid #1e1e2a;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:100}
  .nav-btn{padding:12px 20px;border-radius:10px;border:none;font-size:13px;font-weight:800;cursor:pointer;flex:1;max-width:120px;transition:opacity .15s;-webkit-appearance:none}
  #btn-prev{background:#1a1a28;color:#aaa;border:1px solid #2a2a3a}
  #btn-prev:disabled{opacity:.3;cursor:default}
  #btn-next{color:#000}
  #btn-done{background:#0d1f0d;border:1px solid #34D399;color:#34D399;display:none}

  /* dot indicators */
  .dots{display:flex;gap:5px;align-items:center;flex:1;justify-content:center}
  .dot{height:5px;border-radius:3px;background:#2a2a3a;cursor:pointer;transition:all .2s;min-width:5px}
  .dot.active{min-width:16px}

  /* ── STEP MENU OVERLAY ── */
  #menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;flex-direction:column;justify-content:flex-end}
  #menu-overlay.open{display:flex}
  #menu-sheet{background:#0f0f15;border-radius:20px 20px 0 0;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow-y:auto}
  #menu-handle{width:36px;height:4px;background:#333;border-radius:2px;margin:0 auto 16px}
  .menu-item{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;border-bottom:1px solid #1a1a28}
  .menu-item:last-child{border-bottom:none}
  .menu-item:active{background:#1a1a28}
  .menu-item .m-emoji{font-size:18px;width:28px;text-align:center}
  .menu-item .m-title{font-size:13px;color:#ccc;font-weight:500;flex:1}
  .menu-item.active-item .m-title{color:#fff;font-weight:700}
  .menu-item .m-check{font-size:14px;color:#F5C300}

  /* menu open button */
  #menu-btn{background:#1a1a28;border:1px solid #2a2a3a;border-radius:8px;padding:6px 10px;color:#aaa;font-size:11px;font-weight:700;cursor:pointer;-webkit-appearance:none;letter-spacing:.5px}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div id="header-inner">
      <div class="logo-row">
        <div class="tps">TPS</div>
        <div class="logo-text">
          <div class="l1">TOPLINE</div>
          <div class="l2">PAVEMENT SERVICES</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div id="prog-pill">
          <span id="prog-pct">17%</span>
          <div id="prog-track"><div id="prog-fill" style="width:17%"></div></div>
        </div>
        <button id="menu-btn" onclick="toggleMenu()">☰ STEPS</button>
      </div>
    </div>
  </div>

  <!-- HERO -->
  <div id="hero">
    <div id="hero-step"></div>
    <div id="hero-title"></div>
    <div id="hero-sub"></div>
  </div>

  <!-- SCROLL CONTENT -->
  <div id="scroll"><div id="content-inner"></div></div>

  <!-- BOTTOM NAV -->
  <div id="bottom-nav">
    <button class="nav-btn" id="btn-prev" onclick="go(active-1)" disabled>← Back</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="btn-next" onclick="go(active+1)">Next →</button>
    <div class="nav-btn" id="btn-done">✅ Done!</div>
  </div>
</div>

<!-- STEP MENU OVERLAY -->
<div id="menu-overlay" onclick="closeMenu(event)">
  <div id="menu-sheet">
    <div id="menu-handle"></div>
    <div id="menu-list"></div>
  </div>
</div>

<script>
const GOLD='#F5C300', BLUE='#2B4FD4';

const steps=[
  {id:1,emoji:'💬',color:GOLD,title:'Get Your Code from Claude',sub:'Claude builds the whole website — you just describe what you want.',
   sections:[
    {h:'What is Claude?',body:'Claude is an AI at claude.ai. You describe what you want and it builds an entire website for you — no coding needed. Think of it like texting a smart builder who works in real time.'},
    {h:'Ask Claude to build your app',steps:['Go to claude.ai and log in (or create a free account).','Tap the message box at the bottom.','Type what you want — be specific. Example: "Build me a single HTML file website for Topline Pavement Services with a dark theme, contact form, and yellow and black colours."','Press send. Watch the right side — a live preview appears. This is called an Artifact.','If anything looks wrong, tell Claude what to fix. Example: "Make the button yellow."','Keep tweaking until you are 100% happy.']},
    {h:'IMPORTANT — Convert before copying',steps:['Before copying anything, type this exact message to Claude: "Convert this into a plain single-file HTML page that works when opened directly in a browser. No React, no frameworks, just HTML, CSS and JavaScript all in one file."','Wait for Claude to rebuild it. The preview should look identical.','Now tap the copy icon (two overlapping squares) at the top right of the Artifact box.','Open Notepad (Windows) or TextEdit (Mac) and paste.','Save the file as exactly: index.html — make sure it ends in .html not .txt','Double-click the file. It should open in your browser looking exactly like the Claude preview.']},
    {type:'callout',icon:'⚠️',body:"Why does it look broken without this step? Claude builds previews using React — a tool that only runs inside Claude. A normal browser can't run it. Always convert to plain HTML first."},
    {type:'callout',icon:'💡',body:'If the file looks correct when you double-click it on your computer, it will look correct on Netlify too. What you see locally = what goes live.'}
  ]},
  {id:2,emoji:'📁',color:BLUE,title:'Create Your Project Folder',sub:'One folder per project — like a job folder at the office.',
   sections:[
    {h:'Why bother?',body:'Every website gets its own folder so nothing gets mixed up. Takes 30 seconds and saves a lot of confusion later.'},
    {h:'Create the folder',steps:['Go to your Desktop.','Right-click empty space → New Folder (Windows) or File → New Folder (Mac).','Name it using dashes. Example: topline-estimate-form.','Double-click it to open.']},
    {h:'Move your file in',steps:['Find your index.html from Step 1.','Drag it into your new folder.','That folder now has one file: index.html. That is all you need.']},
    {h:'Preview it',steps:['Double-click index.html inside the folder.','It opens in your browser — this is exactly what it will look like online.','Something wrong? Go back to Claude, describe the fix, get the updated plain HTML, and replace your index.html file.']},
    {type:'callout',icon:'⚠️',body:'The file MUST be named exactly index.html — lowercase, no spaces, ends in .html. If it is called Index.HTML or index.txt it will not work.'}
  ]},
  {id:3,emoji:'🐙',color:'#9B7FE8',title:'Put Your Code on GitHub',sub:'Free cloud storage for your files. No coding skills needed.',
   sections:[
    {h:'What is GitHub?',body:'GitHub is like Google Drive but for website files. Netlify connects to GitHub to grab your files and put them online. You only need to use the GitHub website — no complicated tools.'},
    {h:'Create a free account',steps:['Go to github.com.','Click Sign up in the top right.','Enter your work email and create a password — write it down somewhere safe.','Pick a professional username. Example: topline-mike.','Verify your email by clicking the link GitHub sends you.','You now have a GitHub account!']},
    {h:'Create a new repository',body:"A repository (repo) is just a folder on GitHub for one website. Make a new one per project.",steps:["Click the green 'New' button or '+' → 'New repository'.","Name it using dashes. Example: topline-contact-form.","Select 'Public'. Netlify needs to see it.","Click the green 'Create repository' button."]},
    {h:'Upload your file',steps:["On the new repo page, click the 'uploading an existing file' link.","Drag your index.html into the dashed upload box.","Wait for the green checkmark.","Scroll down and click the green 'Commit changes' button.","Your file is now on GitHub!"]},
    {type:'callout',icon:'🔒',body:'Save your GitHub login somewhere safe — phone notes, a password manager, or written down. You need it every time you update a site.'}
  ]},
  {id:4,emoji:'🚀',color:'#34D399',title:'Deploy on Netlify — Go Live!',sub:'Your site gets a real web address anyone can visit.',
   sections:[
    {h:'What is Netlify?',body:'Netlify is a free platform that reads your files from GitHub and turns them into a live website. Set it up once — it handles everything automatically after that.'},
    {h:'Create your account',steps:['Go to netlify.com.','Click Sign up → Sign up with GitHub.','Click Authorize netlify when prompted.','You are now logged in using your GitHub account.']},
    {h:'Connect and deploy',steps:["Click 'Add new site' → 'Import an existing project'.","Click 'GitHub'.","Find and click your repo. Example: topline-contact-form.","Do NOT change any settings on the next page.","Click 'Deploy site'.","Wait 30 seconds. Green dot + 'Published' = your site is live!"]},
    {h:'Find your live URL',steps:['Look at the top of your Netlify site page.','You will see a URL like: random-words-12345.netlify.app','Click it — your site is live for anyone in the world.','Copy and share the URL with whoever needs it.']},
    {type:'callout',icon:'🎉',body:'Your site is live! From Claude to a live URL takes about 10 minutes the first time. The second time takes about 5.'}
  ]},
  {id:5,emoji:'✏️',color:'#FB923C',title:'Updating Your Site Later',sub:'Something changed? Getting it live takes under 2 minutes.',
   sections:[
    {h:'How it works',body:'Every time you upload a new index.html to GitHub, Netlify detects it and updates your live site within 30 seconds. You never touch Netlify again after the first setup.'},
    {h:'Update step by step',steps:['Go to claude.ai and describe what needs changing. Example: Update phone number to 905-555-1234.','Ask Claude for the updated plain HTML file.','Copy it, paste into Notepad, save as index.html replacing the old one.','Go to github.com and open your repository.','Click your index.html file, then click the pencil ✏️ edit icon.','Select all (Ctrl+A or Cmd+A), delete, paste new code.','Click Commit changes.','Your live site updates automatically within 30 seconds!']},
    {type:'callout',icon:'⚡',body:'Shortcut: Delete the old index.html on GitHub and re-upload the new one by drag-and-drop. Both methods work perfectly.'}
  ]},
  {id:6,emoji:'🗂️',color:'#F472B6',title:'Keeping Netlify Organized',sub:"Multiple sites? Stay tidy — that's the Topline standard.",
   sections:[
    {h:'Rename your site',body:'Netlify gives random names like silly-panda-abc123. Fix it:',steps:['Click your site on the Netlify dashboard.','Click Site configuration → Change site name.','Type a clear name. Example: topline-estimate-form.','Save. Your URL is now: topline-estimate-form.netlify.app']},
    {h:'Keep a master list',steps:['Open a Google Doc or notes app.','Make a simple table: Site Name | Live URL | GitHub Repo | What It Is For | Date.','Update it every time you deploy a new site.','Share it with the team.']},
    {h:'Delete old sites',steps:['Click the site → Site configuration.','Scroll to the bottom → Delete this site.','Type the name to confirm and delete.']},
    {h:'Naming tip',steps:['Give your GitHub repo and Netlify site the same name.','Example: both called topline-estimate-form.','Makes it instantly clear which repo matches which live site.']},
    {type:'callout',icon:'🏆',body:'Treat your sites like job sites — label everything, keep a record, never leave a mess. That is the Topline standard.'}
  ]}
];

let active=0;

function svgDiamond(color,size=7){
  return `<svg width="${size}" height="${size}" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="${color}"/></svg>`;
}

function render(){
  const s=steps[active];
  const pct=Math.round(((active+1)/steps.length)*100);
  const nc=s.color===GOLD?'#000':'#fff';

  // header progress
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-fill').style.width=pct+'%';

  // hero
  document.getElementById('hero').style.background=`linear-gradient(135deg,#0c0c12 50%,${s.color}18)`;
  document.getElementById('hero').style.borderBottom=`2px solid ${s.color}44`;
  document.getElementById('hero-step').innerHTML=`${svgDiamond(s.color,8)}<span style="color:${s.color};font-size:10px;font-weight:800;letter-spacing:2px">STEP ${s.id} OF ${steps.length}</span>${svgDiamond(s.color,8)}`;
  document.getElementById('hero-title').textContent=s.emoji+' '+s.title;
  document.getElementById('hero-sub').textContent=s.sub;

  // content
  let html='';
  s.sections.forEach(sec=>{
    if(sec.type==='callout'){
      html+=`<div class="callout" style="background:linear-gradient(135deg,#14141e,#0f0f1a);border-left-color:${s.color};border-color:${s.color}44">
        <div class="callout-icon">${sec.icon}</div>
        <div class="callout-text">${sec.body}</div>
      </div>`;
    } else {
      html+=`<div class="section">
        <div class="sec-head">${svgDiamond(s.color,7)}<span style="color:${s.color}">${sec.h}</span></div>
        ${sec.body?`<p class="sec-body">${sec.body}</p>`:''}
        ${(sec.steps||[]).map((t,j)=>`
          <div class="step-row">
            <div class="step-num" style="background:${s.color};color:${nc}">${j+1}</div>
            <div class="step-text">${t}</div>
          </div>`).join('')}
      </div>`;
    }
  });
  html+=`<div class="diamond-row">${Array(10).fill(0).map(()=>`<div class="d" style="background:${s.color}"></div>`).join('')}</div>`;
  document.getElementById('content-inner').innerHTML=html;
  document.getElementById('scroll').scrollTop=0;

  // dots
  document.getElementById('dots').innerHTML=steps.map((_,i)=>
    `<div class="dot${i===active?' active':''}" style="${i===active?'background:'+s.color+';min-width:16px':''}" onclick="go(${i})"></div>`).join('');

  // buttons
  const prev=document.getElementById('btn-prev');
  const next=document.getElementById('btn-next');
  const done=document.getElementById('btn-done');
  prev.disabled=active===0;
  if(active===steps.length-1){
    next.style.display='none';
    done.style.display='block';
  } else {
    next.style.display='block';
    next.style.background=s.color;
    next.style.color=nc;
    done.style.display='none';
  }

  // menu
  document.getElementById('menu-list').innerHTML=steps.map((st,i)=>`
    <div class="menu-item${i===active?' active-item':''}" onclick="go(${i});closeMenu()">
      <div class="m-emoji">${st.emoji}</div>
      <div class="m-title">${st.title}</div>
      ${i===active?`<div class="m-check">◆</div>`:''}
    </div>`).join('');
}

function go(i){
  if(i<0||i>=steps.length)return;
  active=i;
  render();
}

function toggleMenu(){
  document.getElementById('menu-overlay').classList.toggle('open');
}

function closeMenu(e){
  if(!e||e.target===document.getElementById('menu-overlay'))
    document.getElementById('menu-overlay').classList.remove('open');
}

render();
</script>
</body>
</html>
