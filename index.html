<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Topline Guide"/>
<meta name="theme-color" content="#111214"/>
<title>Topline — Deployment Guide</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#111214;color:#e0e0e0;font-family:'Inter',system-ui,-apple-system,sans-serif}

/* TEXTURE */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none;z-index:0}

#app{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available;position:relative;z-index:1}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .8s ease, transform .8s ease;background:#0a0a0a}
#splash.hide{opacity:0;transform:scale(1.06);pointer-events:none}

/* asphalt base */
#splash-asphalt{position:absolute;inset:0;background:
  repeating-linear-gradient(97deg,transparent,transparent 2px,rgba(255,255,255,.012) 2px,rgba(255,255,255,.012) 4px),
  repeating-linear-gradient(187deg,transparent,transparent 3px,rgba(255,255,255,.008) 3px,rgba(255,255,255,.008) 6px),
  radial-gradient(ellipse at 30% 40%,#1a1a1a 0%,#0d0d0d 60%,#080808 100%);
  animation:none}

/* crack lines SVG overlay */
#splash-cracks{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:cracksIn 0.4s 0.3s ease forwards}
@keyframes cracksIn{from{opacity:0}to{opacity:1}}

/* shockwave ring */
#splash-shockwave{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid rgba(245,195,0,.9);opacity:0;animation:shockwave 0.5s 0.15s ease-out forwards}
@keyframes shockwave{
  0%{transform:scale(0);opacity:1}
  60%{transform:scale(18);opacity:.4;border-width:2px}
  100%{transform:scale(30);opacity:0;border-width:1px}
}

/* second shockwave */
#splash-shockwave2{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid rgba(43,79,213,.7);opacity:0;animation:shockwave 0.6s 0.3s ease-out forwards}

/* rubble particles */
.rubble{position:absolute;top:50%;left:50%;width:6px;height:6px;background:#2a2a2a;border:1px solid #444;opacity:0;animation:rubbleFly var(--dur) var(--delay) ease-out forwards}
@keyframes rubbleFly{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(0deg) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) rotate(var(--rot)) scale(.2)}
}

/* gold crack glow */
#splash-glow{position:absolute;top:50%;left:50%;width:1px;height:1px;border-radius:50%;background:radial-gradient(circle,rgba(245,195,0,.6) 0%,rgba(245,195,0,.15) 40%,transparent 70%);transform:translate(-50%,-50%) scale(0);animation:glowPulse .5s .1s ease-out forwards}
@keyframes glowPulse{
  0%{transform:translate(-50%,-50%) scale(0);opacity:1}
  50%{transform:translate(-50%,-50%) scale(300);opacity:.5}
  100%{transform:translate(-50%,-50%) scale(400);opacity:0}
}

/* content layers */
#splash-content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center}
.splash-logo{opacity:0;animation:burstIn .5s .5s cubic-bezier(.175,.885,.32,1.4) forwards;filter:drop-shadow(0 0 30px rgba(245,195,0,.4))}
@keyframes burstIn{
  0%{opacity:0;transform:scale(2.5);filter:blur(8px) drop-shadow(0 0 60px rgba(245,195,0,.8))}
  60%{opacity:1;transform:scale(.95);filter:blur(0) drop-shadow(0 0 20px rgba(245,195,0,.5))}
  100%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 12px rgba(245,195,0,.3))}
}
.splash-tagline{font-size:12px;color:#555;letter-spacing:4px;text-transform:uppercase;margin-top:20px;opacity:0;animation:riseIn .5s .9s ease forwards}
.splash-title{font-size:20px;font-weight:800;color:#fff;margin-top:6px;letter-spacing:-.3px;opacity:0;animation:riseIn .5s 1.0s ease forwards}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.splash-bar-wrap{width:140px;height:2px;background:#1e1e1e;border-radius:2px;margin-top:28px;overflow:hidden;opacity:0;animation:riseIn .4s 1.1s ease forwards}
.splash-bar{height:100%;width:0;background:linear-gradient(90deg,#F5C300,#2B4FD4);animation:loadBar 1.4s 1.2s cubic-bezier(.4,0,.2,1) forwards}
.splash-hint{font-size:10px;color:#333;margin-top:12px;letter-spacing:2px;text-transform:uppercase;opacity:0;animation:riseIn .4s 1.2s ease forwards}
@keyframes loadBar{from{width:0}to{width:100%}}

/* ── HEADER ── */
#header{background:linear-gradient(180deg,#0d0d10 0%,#111214 100%);border-bottom:1px solid #1e1e22;padding:16px 20px 14px;flex-shrink:0;text-align:center}
#header svg{filter:drop-shadow(0 4px 16px rgba(245,200,0,.15))}
.header-sub{font-size:10px;color:#444;letter-spacing:3px;text-transform:uppercase;margin-top:6px;font-weight:500}

/* ── SEARCH ── */
#search-wrap{padding:12px 16px 0;flex-shrink:0}
#search-box{width:100%;background:#1a1a1e;border:1px solid #2a2a30;border-radius:12px;padding:11px 16px 11px 40px;font-size:14px;color:#ddd;outline:none;font-family:'Inter',sans-serif;-webkit-appearance:none;position:relative;transition:border-color .2s}
#search-box:focus{border-color:#F5C300}
#search-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none}
#search-container{position:relative}
#search-results{display:none;background:#1a1a1e;border:1px solid #2a2a30;border-radius:12px;margin-top:6px;overflow:hidden}
.sr-item{padding:12px 16px;font-size:13px;color:#ccc;cursor:pointer;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px}
.sr-item:last-child{border-bottom:none}
.sr-item:active{background:#222}
.sr-step{font-size:10px;color:#F5C300;font-weight:700;min-width:50px}

/* ── PROGRESS STRIP ── */
#prog-strip{padding:10px 16px 0;flex-shrink:0}
#prog-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#prog-label{font-size:11px;color:#555;font-weight:600;letter-spacing:.5px}
#prog-pct{font-size:11px;color:#F5C300;font-weight:800}
#prog-track{height:3px;background:#1e1e22;border-radius:2px}
#prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#F5C300,#2B4FD4);transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── HERO ── */
#hero{padding:14px 18px 10px;flex-shrink:0}
#hero-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hero-diamond{width:8px;height:8px;transform:rotate(45deg);flex-shrink:0;transition:background .3s}
#hero-step-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:color .3s}
#hero-title{font-size:22px;color:#fff;font-weight:800;line-height:1.2;letter-spacing:-.3px}
#hero-sub{font-size:14px;color:#555;margin-top:4px;line-height:1.5;font-weight:400}

/* ── CONTENT ── */
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 130px}
.section{margin-bottom:24px;animation:fadeUp .35s ease forwards;opacity:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-top:20px}
.sec-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.sec-body{color:#888;line-height:1.85;font-size:15px;margin:0 0 12px 18px;font-weight:400}

.step-row{display:flex;gap:14px;margin-bottom:14px;align-items:flex-start}
.step-diamond-wrap{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step-diamond{width:28px;height:28px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;transition:background .3s}
.step-diamond-inner{transform:rotate(-45deg);font-size:12px;font-weight:800;line-height:1}
.step-text{color:#bbb;line-height:1.85;font-size:15px;padding-top:4px;font-weight:400}

.callout{display:flex;gap:14px;border-radius:14px;padding:16px 18px;margin-bottom:22px;border-left-width:4px;border-left-style:solid;animation:fadeUp .35s ease forwards;opacity:0}
.callout-icon{font-size:20px;flex-shrink:0;line-height:1.4}
.callout-text{font-size:14px;line-height:1.85;font-weight:400;color:#9ab}

.divider-diamonds{display:flex;gap:6px;align-items:center;margin:20px 0;opacity:.2;flex-wrap:wrap}
.dd{width:6px;height:6px;transform:rotate(45deg)}

/* ── BOTTOM NAV ── */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,16,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #1e1e22;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:100}
.nav-btn{padding:13px 22px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;flex:1;max-width:110px;-webkit-appearance:none;font-family:'Inter',sans-serif;transition:opacity .15s,transform .1s;letter-spacing:-.2px}
.nav-btn:active{transform:scale(.96)}
#btn-prev{background:#1a1a1e;color:#666;border:1px solid #2a2a30}
#btn-prev:disabled{opacity:.25}
#btn-next{color:#000;font-weight:800}
#btn-done{background:#0d1f0d;border:1px solid #34D399;color:#34D399;display:none;font-size:13px}
.dots{display:flex;gap:5px;align-items:center;flex:1;justify-content:center}
.dot{height:4px;border-radius:2px;background:#2a2a30;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);min-width:4px}
.dot.active{min-width:20px}

/* ── MENU ── */
#menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:200;display:none;flex-direction:column;justify-content:flex-end}
#menu-overlay.open{display:flex}
#menu-sheet{background:#141418;border-radius:24px 24px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom,0px));max-height:75vh;overflow-y:auto;border-top:1px solid #2a2a30}
#menu-handle{width:32px;height:3px;background:#2a2a30;border-radius:2px;margin:12px auto 16px}
#menu-title{font-size:11px;color:#444;letter-spacing:2px;text-transform:uppercase;font-weight:700;padding:0 20px 12px}
.menu-item{display:flex;align-items:center;gap:14px;padding:15px 20px;cursor:pointer}
.menu-item:active{background:#1a1a1e}
.menu-item .m-num{font-size:10px;color:#444;font-weight:700;width:20px}
.menu-item .m-emoji{font-size:16px;width:24px;text-align:center}
.menu-item .m-title{font-size:14px;color:#888;font-weight:500;flex:1}
.menu-item.active-item .m-title{color:#fff;font-weight:700}
.menu-item .m-dot{width:6px;height:6px;transform:rotate(45deg);flex-shrink:0}
#menu-btn{background:#1a1a1e;border:1px solid #2a2a30;border-radius:10px;padding:7px 12px;color:#888;font-size:11px;font-weight:700;cursor:pointer;-webkit-appearance:none;letter-spacing:.5px;font-family:'Inter',sans-serif}

/* ── CERTIFICATE ── */
#cert-screen{display:none;position:fixed;inset:0;background:#111214;z-index:500;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
#cert-screen.show{display:flex}
.cert-badge{animation:popIn .6s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.cert-title{font-size:28px;font-weight:900;color:#fff;margin-top:24px;letter-spacing:-.5px}
.cert-sub{font-size:15px;color:#555;margin-top:8px;line-height:1.6;max-width:280px}
.cert-line{width:60px;height:2px;background:linear-gradient(90deg,#F5C300,#2B4FD4);margin:20px auto;border-radius:2px}
.cert-name{font-size:13px;color:#F5C300;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.cert-detail{font-size:12px;color:#444;margin-top:6px}
.cert-btn{margin-top:32px;background:#F5C300;color:#000;border:none;border-radius:12px;padding:14px 32px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:-.2px}
.cert-restart{margin-top:12px;background:transparent;color:#444;border:none;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div id="splash-asphalt"></div>

  <!-- SVG crack lines -->
  <svg id="splash-cracks" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;width:100%;height:100%">
    <defs>
      <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <!-- main cracks radiating from center -->
    <line x1="50%" y1="50%" x2="5%" y2="10%" stroke="#F5C300" stroke-width="1.5" opacity=".7" filter="url(#glow)" stroke-dasharray="300" stroke-dashoffset="300" style="animation:drawCrack .3s .3s ease forwards"/>
    <line x1="50%" y1="50%" x2="95%" y2="8%" stroke="#F5C300" stroke-width="1" opacity=".5" filter="url(#glow)" stroke-dasharray="300" stroke-dashoffset="300" style="animation:drawCrack .3s .35s ease forwards"/>
    <line x1="50%" y1="50%" x2="100%" y2="55%" stroke="#F5C300" stroke-width="1.5" opacity=".6" filter="url(#glow)" stroke-dasharray="300" stroke-dashoffset="300" style="animation:drawCrack .25s .28s ease forwards"/>
    <line x1="50%" y1="50%" x2="0%" y2="60%" stroke="#F5C300" stroke-width="1" opacity=".5" filter="url(#glow)" stroke-dasharray="300" stroke-dashoffset="300" style="animation:drawCrack .3s .32s ease forwards"/>
    <line x1="50%" y1="50%" x2="20%" y2="100%" stroke="#F5C300" stroke-width="1.5" opacity=".65" filter="url(#glow)" stroke-dasharray="300" stroke-dashoffset="300" style="animation:drawCrack .28s .3s ease forwards"/>
    <line x1="50%" y1="50%" x2="80%" y2="100%" stroke="#F5C300" stroke-width="1" opacity=".5" filter="url(#glow)" stroke-dasharray="300" stroke-dashoffset="300" style="animation:drawCrack .3s .36s ease forwards"/>
    <line x1="50%" y1="50%" x2="50%" y2="0%" stroke="#F5C300" stroke-width="1" opacity=".4" filter="url(#glow)" stroke-dasharray="300" stroke-dashoffset="300" style="animation:drawCrack .25s .25s ease forwards"/>
    <!-- secondary smaller cracks -->
    <line x1="50%" y1="50%" x2="15%" y2="35%" stroke="#aaa" stroke-width=".6" opacity=".3" stroke-dasharray="200" stroke-dashoffset="200" style="animation:drawCrack .2s .4s ease forwards"/>
    <line x1="50%" y1="50%" x2="85%" y2="30%" stroke="#aaa" stroke-width=".6" opacity=".3" stroke-dasharray="200" stroke-dashoffset="200" style="animation:drawCrack .2s .42s ease forwards"/>
    <line x1="50%" y1="50%" x2="60%" y2="105%" stroke="#aaa" stroke-width=".6" opacity=".3" stroke-dasharray="200" stroke-dashoffset="200" style="animation:drawCrack .2s .38s ease forwards"/>
    <style>
      @keyframes drawCrack{to{stroke-dashoffset:0}}
    </style>
  </svg>

  <div id="splash-glow"></div>
  <div id="splash-shockwave"></div>
  <div id="splash-shockwave2"></div>

  <!-- rubble particles -->
  <div class="rubble" style="--tx:-120px;--ty:-180px;--rot:135deg;--dur:.6s;--delay:.2s;width:8px;height:5px"></div>
  <div class="rubble" style="--tx:140px;--ty:-160px;--rot:-80deg;--dur:.5s;--delay:.22s;width:5px;height:8px"></div>
  <div class="rubble" style="--tx:160px;--ty:140px;--rot:200deg;--dur:.55s;--delay:.18s;width:9px;height:4px"></div>
  <div class="rubble" style="--tx:-150px;--ty:160px;--rot:-120deg;--dur:.5s;--delay:.25s;width:6px;height:6px"></div>
  <div class="rubble" style="--tx:-80px;--ty:-200px;--rot:60deg;--dur:.65s;--delay:.2s;width:4px;height:9px"></div>
  <div class="rubble" style="--tx:100px;--ty:-190px;--rot:-45deg;--dur:.6s;--delay:.23s;width:7px;height:4px"></div>
  <div class="rubble" style="--tx:180px;--ty:-60px;--rot:170deg;--dur:.5s;--delay:.19s;width:5px;height:7px"></div>
  <div class="rubble" style="--tx:-170px;--ty:80px;--rot:-160deg;--dur:.58s;--delay:.21s;width:8px;height:3px"></div>
  <div class="rubble" style="--tx:50px;--ty:200px;--rot:90deg;--dur:.52s;--delay:.24s;width:6px;height:5px"></div>
  <div class="rubble" style="--tx:-60px;--ty:190px;--rot:-70deg;--dur:.6s;--delay:.2s;width:4px;height:8px"></div>

  <div id="splash-content">
    <div class="splash-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="160" height="160">
        <polygon points="340,10 670,260 340,510 10,260" fill="#F5C800"/>
        <polygon points="340,32 648,260 340,488 32,260" fill="#111111"/>
        <polygon points="340,55 625,260 340,465 55,260" fill="#1A3DB5"/>
        <rect x="30" y="210" width="620" height="100" rx="18" ry="18" fill="#F5C800"/>
        <rect x="38" y="218" width="604" height="84" rx="13" ry="13" fill="#111111"/>
        <text x="340" y="282" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="72" fill="white" text-anchor="middle" letter-spacing="8">TOPLINE</text>
        <text x="340" y="370" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" fill="white" text-anchor="middle" letter-spacing="3">PAVEMENT</text>
        <text x="340" y="408" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" fill="white" text-anchor="middle" letter-spacing="3">SERVICES</text>
        <text x="340" y="118" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="white" text-anchor="middle">EST.1985</text>
        <g transform="translate(340,155) scale(1.1)">
          <path d="M 0,-42 L 5,-28 L 18,-32 L 12,-20 L 28,-16 L 16,-6 L 20,4 L 8,2 L 8,22 L -8,22 L -8,2 L -20,4 L -16,-6 L -28,-16 L -12,-20 L -18,-32 L -5,-28 Z" fill="#CC0000"/>
        </g>
      </svg>
    </div>
    <div class="splash-tagline">Internal Team Guide</div>
    <div class="splash-title">Website Deployment</div>
    <div class="splash-bar-wrap"><div class="splash-bar"></div></div>
    <div class="splash-hint">Loading…</div>
  </div>
</div>

<!-- CERTIFICATE -->
<div id="cert-screen">
  <div class="cert-badge">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="110" height="85">
      <polygon points="340,10 670,260 340,510 10,260" fill="#F5C800"/>
      <polygon points="340,32 648,260 340,488 32,260" fill="#111111"/>
      <polygon points="340,55 625,260 340,465 55,260" fill="#1A3DB5"/>
      <rect x="30" y="210" width="620" height="100" rx="18" ry="18" fill="#F5C800"/>
      <rect x="38" y="218" width="604" height="84" rx="13" ry="13" fill="#111111"/>
      <text x="340" y="282" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="72" fill="white" text-anchor="middle" letter-spacing="8">TOPLINE</text>
      <text x="340" y="370" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" fill="white" text-anchor="middle" letter-spacing="3">PAVEMENT</text>
      <text x="340" y="408" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" fill="white" text-anchor="middle" letter-spacing="3">SERVICES</text>
      <text x="340" y="118" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="white" text-anchor="middle">EST.1985</text>
      <g transform="translate(340,155) scale(1.1)">
        <path d="M 0,-42 L 5,-28 L 18,-32 L 12,-20 L 28,-16 L 16,-6 L 20,4 L 8,2 L 8,22 L -8,22 L -8,2 L -20,4 L -16,-6 L -28,-16 L -12,-20 L -18,-32 L -5,-28 Z" fill="#CC0000"/>
      </g>
    </svg>
  </div>
  <div class="cert-title">Guide Complete</div>
  <div class="cert-sub">You've completed all 6 steps of the Topline Website Deployment Guide.</div>
  <div class="cert-line"></div>
  <div class="cert-name">Topline Pavement Services</div>
  <div class="cert-detail">Internal Developer Certification — Est. 1985</div>
  <button class="cert-btn" onclick="hideCert()">← Back to Guide</button>
  <button class="cert-restart" onclick="restart()">Start from Step 1</button>
</div>

<!-- APP -->
<div id="app">
  <!-- HEADER -->
  <div id="header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="200" height="200">
      <polygon points="340,10 670,260 340,510 10,260" fill="#F5C800"/>
      <polygon points="340,32 648,260 340,488 32,260" fill="#111111"/>
      <polygon points="340,55 625,260 340,465 55,260" fill="#1A3DB5"/>
      <rect x="30" y="210" width="620" height="100" rx="18" ry="18" fill="#F5C800"/>
      <rect x="38" y="218" width="604" height="84" rx="13" ry="13" fill="#111111"/>
      <text x="340" y="282" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="72" fill="white" text-anchor="middle" letter-spacing="8">TOPLINE</text>
      <text x="340" y="370" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" fill="white" text-anchor="middle" letter-spacing="3">PAVEMENT</text>
      <text x="340" y="408" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" fill="white" text-anchor="middle" letter-spacing="3">SERVICES</text>
      <text x="340" y="118" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="white" text-anchor="middle">EST.1985</text>
      <g transform="translate(340,155) scale(1.1)">
        <path d="M 0,-42 L 5,-28 L 18,-32 L 12,-20 L 28,-16 L 16,-6 L 20,4 L 8,2 L 8,22 L -8,22 L -8,2 L -20,4 L -16,-6 L -28,-16 L -12,-20 L -18,-32 L -5,-28 Z" fill="#CC0000"/>
      </g>
    </svg>
    <div class="header-sub">Internal Deployment Guide</div>
  </div>

  <!-- SEARCH -->
  <div id="search-wrap">
    <div id="search-container">
      <span id="search-icon">🔍</span>
      <input id="search-box" type="search" placeholder="Search steps…" oninput="doSearch(this.value)" onfocus="doSearch(this.value)" onblur="setTimeout(()=>hideSearch(),200)"/>
      <div id="search-results"></div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div id="prog-strip">
    <div id="prog-info">
      <span id="prog-label">STEP 1 OF 6</span>
      <span id="prog-pct">17%</span>
    </div>
    <div id="prog-track"><div id="prog-fill" style="width:17%"></div></div>
  </div>

  <!-- HERO -->
  <div id="hero">
    <div id="hero-eyebrow">
      <div class="hero-diamond" id="hd"></div>
      <div id="hero-step-label"></div>
    </div>
    <div id="hero-title"></div>
    <div id="hero-sub"></div>
  </div>

  <!-- SCROLL -->
  <div id="scroll"><div id="content-inner"></div></div>

  <!-- BOTTOM NAV -->
  <div id="bottom-nav">
    <button class="nav-btn" id="btn-prev" onclick="go(active-1)" disabled>← Back</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="btn-next" onclick="go(active+1)">Next →</button>
    <div class="nav-btn" id="btn-done" onclick="showCert()">✅ Done!</div>
    <button id="menu-btn" onclick="toggleMenu()">☰</button>
  </div>
</div>

<!-- MENU -->
<div id="menu-overlay" onclick="closeMenu(event)">
  <div id="menu-sheet">
    <div id="menu-handle"></div>
    <div id="menu-title">All Steps</div>
    <div id="menu-list"></div>
  </div>
</div>

<script>
const GOLD='#F5C300', BLUE='#2B4FD4';
const steps=[
  {id:1,emoji:'💬',color:GOLD,title:'Get Your Code from Claude',sub:'Claude builds the whole website — you just describe what you want.',sections:[
    {h:'What is Claude?',body:'Claude is an AI at claude.ai. You describe what you want and it builds an entire website for you — no coding needed. Think of it like texting a very smart builder who works in real time.'},
    {h:'Ask Claude to build your app',steps:['Go to claude.ai and log in or create a free account.','Tap the message box at the bottom.','Type what you want — be specific. Example: "Build me a single HTML file website for Topline Pavement Services with a dark theme, contact form, and yellow and black colours."','Press send. A live preview called an Artifact appears on the right.','If anything looks wrong, tell Claude what to fix.','Keep tweaking until you are 100% happy.']},
    {h:'IMPORTANT — Convert before copying',steps:['Before copying, type this to Claude: "Convert this into a plain single-file HTML page that works when opened directly in a browser. No React, no frameworks, just HTML, CSS and JavaScript all in one file."','Wait for Claude to rebuild it.','Tap the copy icon at the top right of the Artifact.','Open Notepad (Windows) or TextEdit (Mac) and paste.','Save as exactly: index.html — must end in .html','Double-click the file. It should look exactly like the Claude preview.']},
    {type:'callout',icon:'⚠️',body:"Claude builds previews using React — a tool that only runs inside Claude. A normal browser can't run it. Always convert to plain HTML first."},
    {type:'callout',icon:'💡',body:'If it looks correct when you double-click it locally, it will look correct on Netlify too.'}
  ]},
  {id:2,emoji:'📁',color:BLUE,title:'Create Your Project Folder',sub:'One folder per project — like a job folder at the office.',sections:[
    {h:'Why bother?',body:'Every website gets its own folder so nothing gets mixed up. Takes 30 seconds and saves a lot of confusion later.'},
    {h:'Create the folder',steps:['Go to your Desktop.','Right-click empty space → New Folder (Windows) or File → New Folder (Mac).','Name it using dashes. Example: topline-estimate-form.','Double-click it to open.']},
    {h:'Move your file in',steps:['Find your index.html from Step 1.','Drag it into your new folder.','That folder now has one file: index.html. That is all you need.']},
    {h:'Preview it',steps:['Double-click index.html — it opens in your browser.','This is exactly what it will look like online.','Something wrong? Go back to Claude, get the fix, replace your index.html.']},
    {type:'callout',icon:'⚠️',body:'The file MUST be named exactly index.html — lowercase, no spaces, ends in .html. Anything else will not work.'}
  ]},
  {id:3,emoji:'🐙',color:'#9B7FE8',title:'Put Your Code on GitHub',sub:'Free cloud storage for your files. No coding skills needed.',sections:[
    {h:'What is GitHub?',body:'GitHub is like Google Drive but for website files. Netlify connects to GitHub to grab your files and put them online.'},
    {h:'Create a free account',steps:['Go to github.com.','Click Sign up in the top right.','Enter your work email and create a password — write it down.','Pick a professional username. Example: topline-mike.','Verify your email by clicking the link GitHub sends you.']},
    {h:'Create a new repository',body:'A repository is just a folder on GitHub for one website. Make a new one per project.',steps:["Click the green 'New' button or '+' → 'New repository'.","Name it using dashes. Example: topline-contact-form.","Select 'Public'. Netlify needs to see it.","Click 'Create repository'."]},
    {h:'Upload your file',steps:["Click the 'uploading an existing file' link on the repo page.","Drag your index.html into the dashed upload box.","Wait for the green checkmark.","Click the green 'Commit changes' button.","Your file is now on GitHub!"]},
    {type:'callout',icon:'🔒',body:'Save your GitHub login somewhere safe. You need it every time you update a site.'}
  ]},
  {id:4,emoji:'🚀',color:'#34D399',title:'Deploy on Netlify — Go Live!',sub:'Your site gets a real web address anyone can visit.',sections:[
    {h:'What is Netlify?',body:'Netlify is a free platform that reads your files from GitHub and turns them into a live website. Set it up once — it handles everything after that.'},
    {h:'Create your account',steps:['Go to netlify.com.','Click Sign up → Sign up with GitHub.','Click Authorize netlify when prompted.','You are now logged in using your GitHub account.']},
    {h:'Connect and deploy',steps:["Click 'Add new site' → 'Import an existing project'.","Click 'GitHub'.","Find and click your repo. Example: topline-contact-form.","Do NOT change any settings.","Click 'Deploy site'.","Wait 30 seconds. Green dot + 'Published' = your site is live!"]},
    {h:'Find your live URL',steps:['Look at the top of your Netlify site page.','You will see a URL like: random-words-12345.netlify.app','Click it — your site is live for anyone in the world.','Copy and share the URL.']},
    {type:'callout',icon:'🎉',body:'From Claude to a live URL takes about 10 minutes the first time. The second time takes 5.'}
  ]},
  {id:5,emoji:'✏️',color:'#FB923C',title:'Updating Your Site Later',sub:'Something changed? Getting it live takes under 2 minutes.',sections:[
    {h:'How it works',body:'Every time you upload a new index.html to GitHub, Netlify detects it and updates your live site within 30 seconds.'},
    {h:'Update step by step',steps:['Go to claude.ai and describe what needs changing.','Ask Claude for the updated plain HTML file.','Copy it, paste into Notepad, save as index.html replacing the old one.','Go to github.com and open your repository.','Click your index.html file then click the pencil ✏️ icon.','Select all (Ctrl+A or Cmd+A), delete, paste new code.','Click Commit changes.','Your live site updates automatically within 30 seconds!']},
    {type:'callout',icon:'⚡',body:'Shortcut: Delete the old index.html on GitHub and re-upload the new one by drag-and-drop. Both methods work.'}
  ]},
  {id:6,emoji:'🗂️',color:'#F472B6',title:'Keeping Netlify Organized',sub:"Multiple sites? Stay tidy — that's the Topline standard.",sections:[
    {h:'Rename your site',body:'Netlify gives random names like silly-panda-abc123. Fix it:',steps:['Click your site on the Netlify dashboard.','Click Site configuration → Change site name.','Type a clear name. Example: topline-estimate-form.','Save. Your URL is now: topline-estimate-form.netlify.app']},
    {h:'Keep a master list',steps:['Open a Google Doc or notes app.','Make a table: Site Name | Live URL | GitHub Repo | What It Is For | Date.','Update it every time you deploy a new site.','Share it with the team.']},
    {h:'Delete old sites',steps:['Click the site → Site configuration.','Scroll to the bottom → Delete this site.','Type the name to confirm and delete.']},
    {h:'Pro naming tip',steps:['Give your GitHub repo and Netlify site the exact same name.','Example: both called topline-estimate-form.','Makes it instantly clear which repo matches which live site.']},
    {type:'callout',icon:'🏆',body:'Treat your sites like job sites — label everything, keep a record, never leave a mess. That is the Topline standard.'}
  ]}
];

// Build search index
const searchIndex=[];
steps.forEach(s=>{
  s.sections.forEach(sec=>{
    if(sec.type==='callout')return;
    searchIndex.push({stepId:s.id,stepIdx:steps.indexOf(s),emoji:s.emoji,stepTitle:s.title,heading:sec.h,color:s.color});
    (sec.steps||[]).forEach((t,i)=>{
      searchIndex.push({stepId:s.id,stepIdx:steps.indexOf(s),emoji:s.emoji,stepTitle:s.title,heading:sec.h,text:t,color:s.color});
    });
  });
});

let active=0;

function svgD(color,size=7){return `<svg width="${size}" height="${size}" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="${color}"/></svg>`;}

function render(animate=true){
  const s=steps[active];
  const pct=Math.round(((active+1)/steps.length)*100);
  const nc=s.color===GOLD?'#000':'#fff';

  document.getElementById('prog-label').textContent=`STEP ${s.id} OF ${steps.length}`;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-fill').style.width=pct+'%';

  document.getElementById('hd').style.background=s.color;
  document.getElementById('hero-step-label').style.color=s.color;
  document.getElementById('hero-step-label').textContent=s.title.toUpperCase();
  document.getElementById('hero-title').textContent=s.emoji+' '+s.title;
  document.getElementById('hero-sub').textContent=s.sub;

  let html='';
  s.sections.forEach((sec,si)=>{
    const delay=si*0.06;
    if(sec.type==='callout'){
      html+=`<div class="callout" style="background:linear-gradient(135deg,#18181c,#141418);border-left-color:${s.color};border-top-color:${s.color}22;border-right-color:${s.color}22;border-bottom-color:${s.color}22;animation-delay:${delay}s"><div class="callout-icon">${sec.icon}</div><div class="callout-text">${sec.body}</div></div>`;
    } else {
      html+=`<div class="section" style="animation-delay:${delay}s">
        <div class="sec-head">${svgD(s.color,7)}<span class="sec-label" style="color:${s.color}">${sec.h}</span></div>
        ${sec.body?`<p class="sec-body">${sec.body}</p>`:''}
        ${(sec.steps||[]).map((t,j)=>`
          <div class="step-row">
            <div class="step-diamond-wrap">
              <div class="step-diamond" style="background:${s.color}">
                <div class="step-diamond-inner" style="color:${nc}">${j+1}</div>
              </div>
            </div>
            <div class="step-text">${t}</div>
          </div>`).join('')}
      </div>`;
    }
  });
  html+=`<div class="divider-diamonds">${Array(12).fill(0).map(()=>`<div class="dd" style="background:${s.color}"></div>`).join('')}</div>`;
  document.getElementById('content-inner').innerHTML=html;
  document.getElementById('scroll').scrollTop=0;

  document.getElementById('dots').innerHTML=steps.map((_,i)=>
    `<div class="dot${i===active?' active':''}" style="${i===active?'background:'+s.color+';min-width:20px':''}" onclick="go(${i})"></div>`).join('');

  const prev=document.getElementById('btn-prev');
  const next=document.getElementById('btn-next');
  const done=document.getElementById('btn-done');
  prev.disabled=active===0;
  if(active===steps.length-1){next.style.display='none';done.style.display='block';}
  else{next.style.display='block';next.style.background=s.color;next.style.color=nc;done.style.display='none';}

  document.getElementById('menu-list').innerHTML=steps.map((st,i)=>`
    <div class="menu-item${i===active?' active-item':''}" onclick="go(${i});closeMenu()">
      <div class="m-num">${st.id}</div>
      <div class="m-emoji">${st.emoji}</div>
      <div class="m-title">${st.title}</div>
      ${i===active?`<div class="m-dot" style="background:${st.color}"></div>`:''}
    </div>`).join('');
}

function go(i){
  if(i<0||i>=steps.length)return;
  active=i;
  render();
}

function doSearch(q){
  const box=document.getElementById('search-results');
  if(!q||q.length<2){box.style.display='none';return;}
  const results=searchIndex.filter(r=>(r.heading+' '+(r.text||'')+' '+r.stepTitle).toLowerCase().includes(q.toLowerCase())).slice(0,5);
  if(!results.length){box.style.display='none';return;}
  const seen=new Set();
  box.innerHTML=results.filter(r=>{const k=r.stepIdx+r.heading;if(seen.has(k))return false;seen.add(k);return true;}).map(r=>`
    <div class="sr-item" onclick="go(${r.stepIdx});hideSearch();document.getElementById('search-box').value=''">
      <span class="sr-step" style="color:${r.color}">${r.emoji} Step ${r.stepId}</span>
      <span>${r.heading}</span>
    </div>`).join('');
  box.style.display='block';
}

function hideSearch(){document.getElementById('search-results').style.display='none';}
function toggleMenu(){document.getElementById('menu-overlay').classList.toggle('open');}
function closeMenu(e){if(!e||e.target===document.getElementById('menu-overlay'))document.getElementById('menu-overlay').classList.remove('open');}
function showCert(){document.getElementById('cert-screen').classList.add('show');}
function hideCert(){document.getElementById('cert-screen').classList.remove('show');}
function restart(){hideCert();go(0);}

// Splash
setTimeout(()=>{
  document.getElementById('splash').classList.add('hide');
  setTimeout(()=>document.getElementById('splash').style.display='none',700);
},2400);

render();
</script>
</body>
</html>
